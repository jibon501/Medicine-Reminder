name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # একটাই universal APK (সব ফোনের জন্য), ডিবাগ কী দিয়ে অটো-সাইন হয়
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MedicineReminder.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedicineReminder-apk
          path: MedicineReminder.apk

      # রিলিজ এই রিপোতেই হয়। রিপো private থাকলে শুধু আপনি দেখবেন, পরে public করলে সবাই APK নামাতে পারবে
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Medicine Reminder build ${{ github.run_number }}
          files: MedicineReminder.apk
